<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TheCPMachine — Cool Pictures</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111'/%3E%3Crect x='3' y='3' width='58' height='58' rx='13' fill='none' stroke='%23ff7a1a' stroke-width='4'/%3E%3Ctext x='32' y='43' font-family='Arial Black,Arial' font-weight='900' font-size='28' text-anchor='middle'%3E%3Ctspan fill='%23ff7a1a'%3EC%3C/tspan%3E%3Ctspan fill='%23fff'%3EP%3C/tspan%3E%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0c0a09; --panel:#161210; --panel2:#1e1916; --line:#33281f;
    --text:#f6f2ee; --muted:#a8a0a0; --a:#ff7a1a; --b:#ff8f2e; --c:#ffb066;
    --grad:linear-gradient(120deg,var(--a),var(--b) 55%,var(--c));
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;
    background-image:radial-gradient(800px 400px at 10% -10%,#ff7a1a22,transparent),radial-gradient(700px 400px at 100% 0%,#ffffff0d,transparent)}
  header{max-width:1100px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;gap:12px}
  .logo{width:46px;height:46px;border-radius:13px;background:#111;border:3px solid var(--a);display:grid;place-items:center;font:900 21px/1 "Space Grotesk";letter-spacing:-1px;box-shadow:0 0 18px #ff7a1a55}
  .logo .c{color:var(--a)} .logo .p{color:#fff}
  h1{font-family:"Space Grotesk";font-size:24px;margin:0}
  h1 span{color:var(--a)} h1 small{color:var(--muted);font-weight:500}
  .tag{color:var(--muted);font-size:14px;margin-left:auto}
  .credits{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 10px}
  .credits .bolt{width:26px;height:26px;border-radius:50%;background:var(--a);display:grid;place-items:center;font-size:14px}
  .credits b{font:700 16px "Space Grotesk"} .credits small{color:var(--muted);font-size:12px;display:block;line-height:1.1}
  .cbar{width:70px;height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
  .cbar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),#fff);transition:width .4s}
  .credits.low{border-color:#ff5a3c} .credits.bump{animation:bump .4s}
  @keyframes bump{50%{transform:scale(1.08)}}
  .cost{display:inline-block;margin-left:6px;font:600 12px Inter;background:#0003;padding:3px 8px;border-radius:99px;vertical-align:middle}
  main{max-width:1100px;margin:0 auto;padding:16px 20px 60px;display:grid;grid-template-columns:420px 1fr;gap:20px}
  @media(max-width:880px){main{grid-template-columns:1fr}.tag{display:none}.credits{margin-left:auto}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
  .tabs{display:flex;background:var(--panel2);border-radius:12px;padding:4px;margin-bottom:16px}
  .tabs button{flex:1;border:0;background:none;color:var(--muted);padding:10px;border-radius:9px;font:600 14px Inter;cursor:pointer}
  .tabs button.on{background:var(--grad);color:#fff}
  @media(max-width:520px){.tabs button{font-size:12.5px;padding:9px 4px}}
  .thumbs.single{grid-template-columns:1fr;max-width:240px}
  .thumbs.single .thumb{aspect-ratio:auto} .thumbs.single .thumb img{height:auto;max-height:240px;object-fit:contain;background:#000}
  label.h{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 8px}
  textarea{width:100%;min-height:110px;resize:vertical;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;font:15px Inter;outline:none}
  textarea:focus{border-color:var(--a)}
  .drop{border:2px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s;font-size:14px}
  .drop.over,.drop:hover{border-color:var(--a);color:var(--text);background:#ff7a1a10}
  .thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:#000a;color:#fff;cursor:pointer;font-size:13px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:7px 11px;border-radius:999px;font:500 13px Inter;cursor:pointer}
  .chip.on{border-color:transparent;background:var(--grad)}
  .go{width:100%;margin-top:18px;border:0;border-radius:14px;padding:15px;font:700 16px "Space Grotesk";color:#fff;background:var(--grad);cursor:pointer;transition:transform .1s, opacity .2s}
  .go:active{transform:scale(.98)} .go:disabled{opacity:.5;cursor:wait}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
  .stage{min-height:460px;display:flex;flex-direction:column}
  .result{flex:1;display:grid;place-items:center;background:var(--panel2);border-radius:14px;overflow:hidden;position:relative;min-height:400px}
  .result img{max-width:100%;max-height:640px;display:block}
  .empty{color:var(--muted);text-align:center;padding:30px}
  .empty b{display:block;font:700 20px "Space Grotesk";color:var(--text);margin-bottom:6px}
  /* ---- machine loading animation ---- */
  #loading{display:flex;flex-direction:column;align-items:center;gap:18px}
  .machine{position:relative;width:200px;height:200px}
  .ring{position:absolute;inset:0;border-radius:50%;border:3px dashed #ff7a1a66;animation:spin 9s linear infinite}
  .ring.r2{inset:18px;border:3px solid transparent;border-top-color:var(--a);border-right-color:var(--a);animation:spin 1.4s cubic-bezier(.6,.1,.4,.9) infinite}
  .ring.r3{inset:36px;border:3px solid transparent;border-bottom-color:#fff;border-left-color:#fff;animation:spin 2.2s linear infinite reverse}
  .core{position:absolute;inset:58px;border-radius:18px;background:#111;border:3px solid var(--a);display:grid;place-items:center;overflow:hidden;
        font:900 34px/1 "Space Grotesk";letter-spacing:-1px;animation:pulse 1.6s ease-in-out infinite}
  .core .c{color:var(--a)} .core .p{color:#fff}
  .core::after{content:"";position:absolute;left:0;right:0;height:30%;background:linear-gradient(180deg,transparent,#ff7a1a66,transparent);animation:scan 1.3s linear infinite}
  .spark{position:absolute;width:8px;height:8px;border-radius:2px;background:var(--a);top:50%;left:50%;margin:-4px;
         animation:orbit 2.4s linear infinite;box-shadow:0 0 10px var(--a)}
  .spark:nth-child(5){animation-delay:-.8s;background:#fff;box-shadow:0 0 10px #fff}
  .spark:nth-child(6){animation-delay:-1.6s}
  .bar{width:220px;height:8px;border-radius:99px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),#fff);border-radius:99px;transition:width .4s ease}
  .loadmsg{font:600 15px "Space Grotesk";color:var(--text);min-height:20px;text-align:center}
  .loadmsg::after{content:"▌";color:var(--a);animation:blink .8s steps(1) infinite;margin-left:2px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{box-shadow:0 0 28px #ff7a1a99;transform:scale(1.05)}}
  @keyframes scan{from{top:-30%}to{top:100%}}
  @keyframes orbit{from{transform:rotate(0) translateX(100px) rotate(0)}to{transform:rotate(360deg) translateX(100px) rotate(-360deg)}}
  @keyframes blink{50%{opacity:0}}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:10px;font:600 14px Inter;cursor:pointer}
  .btn:hover{border-color:var(--a)}
  .err{color:#ff8a8a;font-size:14px;margin-top:10px}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:14px}
  .gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer;border:1px solid var(--line)}
  .hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="logo"><span><span class="c">C</span><span class="p">P</span></span></div>
  <h1>The<span>CP</span>Machine</h1>
  <div class="tag">Cool Pictures. Made by machine.</div>
  <div class="credits" id="credits" title="Credits reset every day at midnight">
    <div class="bolt">⚡</div>
    <div><b id="cNum">10</b> <span style="color:var(--muted)">/ <span id="cMax">10</span></span><small>credits today</small></div>
    <div class="cbar"><i id="cBar" style="width:100%"></i></div>
  </div>
</header>

<main>
  <section class="card">
    <div class="tabs">
      <button id="tCreate" class="on">✨ Create</button>
      <button id="tCombine">🧩 Combine</button>
      <button id="tEdit">✏️ Edit photo</button>
    </div>

    <div id="photoBox" class="hidden">
      <label class="h" id="photoLabel">Your photos (2–4)</label>
      <div class="drop" id="drop">📁 Click or drag photos here</div>
      <input type="file" id="file" accept="image/*" multiple hidden />
      <div class="thumbs" id="thumbs"></div>
    </div>

    <label class="h" id="promptLabel">Describe your image</label>
    <textarea id="prompt" placeholder="A cat astronaut floating above Earth, cinematic lighting"></textarea>

    <div id="quickBox" class="hidden">
      <label class="h">Quick edits</label>
      <div class="chips" id="quick">
        <button class="chip" data-v="Change the background to a sunny tropical beach">🏖 Beach background</button>
        <button class="chip" data-v="Make it nighttime with city lights">🌃 Night time</button>
        <button class="chip" data-v="Make it a snowy winter scene">❄️ Winter</button>
        <button class="chip" data-v="Add cool sunglasses to the person">😎 Add sunglasses</button>
        <button class="chip" data-v="Turn the photo into an anime drawing">🎌 Anime me</button>
        <button class="chip" data-v="Turn the photo into a 3D Pixar-style cartoon">🧸 3D cartoon</button>
        <button class="chip" data-v="Make it look like an old vintage photo">📷 Vintage</button>
        <button class="chip" data-v="Change the background to outer space with stars and planets">🚀 Space</button>
      </div>
    </div>

    <label class="h">Style</label>
    <div class="chips" id="styles">
      <button class="chip on" data-v="">None</button>
      <button class="chip" data-v="photorealistic, 4k photo">Realistic</button>
      <button class="chip" data-v="anime style">Anime</button>
      <button class="chip" data-v="3D Pixar-style render">3D cartoon</button>
      <button class="chip" data-v="oil painting">Painting</button>
      <button class="chip" data-v="pixel art">Pixel art</button>
      <button class="chip" data-v="cyberpunk neon">Cyberpunk</button>
    </div>

    <label class="h">Shape</label>
    <div class="chips" id="aspects">
      <button class="chip hidden" data-v="orig" id="origChip">Original</button>
      <button class="chip on" data-v="1:1" id="squareChip">Square</button>
      <button class="chip" data-v="16:9">Wide</button>
      <button class="chip" data-v="9:16">Tall</button>
    </div>

    <button class="go" id="go">Generate <span class="cost" id="costTag">1 credit</span></button>
    <div class="hint" id="hint">Tip: be specific — subject, place, lighting, mood.</div>
    <div class="err" id="err"></div>
  </section>

  <section class="card stage">
    <div class="result" id="result">
      <div class="empty" id="empty"><b>Your cool picture shows up here</b>Type a prompt or add photos, then hit Generate.</div>
      <div class="empty hidden" id="loading">
        <div class="machine">
          <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
          <div class="spark"></div><div class="spark"></div><div class="spark"></div>
          <div class="core"><span><span class="c">C</span><span class="p">P</span></span></div>
        </div>
        <div class="bar"><i id="barFill"></i></div>
        <div class="loadmsg" id="loadMsg">Starting the machine</div>
      </div>
      <img id="out" class="hidden" alt="Generated image" />
    </div>
    <div class="actions hidden" id="actions">
      <button class="btn" id="dl">⬇ Download</button>
      <button class="btn" id="again">🔁 Try again</button>
      <button class="btn" id="editIt">✏️ Edit this</button>
      <button class="btn" id="useIt">🧩 Use in Combine</button>
    </div>
    <label class="h">Recent</label>
    <div class="gallery" id="gallery"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const store = { combine: [], edit: [] };
let mode = "create", photos = store.combine, style = "", aspect = "1:1", lastImage = null, editDims = null;

// --- credits ---
let credits = { left: 10, max: 10, create: 1, combine: 2 };
const dayKey = () => new Date().toISOString().slice(0,10);
function localUsed(){ try{ const o = JSON.parse(localStorage.getItem("cp_credits")||"{}"); return o.day === dayKey() ? o.used : 0; }catch{ return 0; } }
function setLocalUsed(n){ try{ localStorage.setItem("cp_credits", JSON.stringify({ day: dayKey(), used: n })); }catch{} }
function costNow(){ return mode === "create" ? credits.create : credits.combine; }
function renderCredits(bump){
  $("cNum").textContent = credits.left; $("cMax").textContent = credits.max;
  $("cBar").style.width = (100 * credits.left / credits.max) + "%";
  $("credits").classList.toggle("low", credits.left <= 2);
  if (bump){ $("credits").classList.remove("bump"); void $("credits").offsetWidth; $("credits").classList.add("bump"); }
  const c = costNow();
  $("costTag").textContent = c + (c === 1 ? " credit" : " credits");
  if (!$("go").dataset.busy) $("go").disabled = credits.left < c;
}
function applyServer(j){
  if (!j || typeof j.credits !== "number") return;
  credits.max = j.max; credits.create = j.costCreate; credits.combine = j.costCombine;
  // use whichever says fewer credits left (server memory can reset)
  credits.left = Math.min(j.credits, Math.max(0, j.max - localUsed()));
  renderCredits();
}
fetch("/api/generate").then(r => r.json()).then(applyServer).catch(() => {
  credits.left = Math.max(0, credits.max - localUsed()); renderCredits();
});

// --- history (per-browser) ---
function loadHist(){ try{ return JSON.parse(localStorage.getItem("pf_hist")||"[]"); }catch{ return []; } }
function saveHist(h){ try{ localStorage.setItem("pf_hist", JSON.stringify(h.slice(0,12))); }catch{ /* storage full */ } }
function renderHist(){
  const g = $("gallery"); g.innerHTML = "";
  loadHist().forEach(src => { const i = new Image(); i.src = src; i.onclick = () => show(src); g.appendChild(i); });
}

// --- tabs ---
const MODES = {
  create:  { label: "Describe your image", ph: "A cat astronaut floating above Earth, cinematic lighting",
             hint: "Tip: be specific — subject, place, lighting, mood." },
  combine: { label: "How should they be combined? (optional)", ph: "Put the cat from image 0 on the hood of the car in image 1",
             hint: "Add 2–4 photos. Photos are numbered image 0, image 1, image 2…" },
  edit:    { label: "What should change?", ph: "Change my shirt to red and put me on a mountain",
             hint: "Upload 1 photo, then type a change or tap a quick edit." },
};
function pickAspect(v){
  aspect = v;
  [...$("aspects").children].forEach(c => c.classList.toggle("on", c.dataset.v === v));
}
function setMode(m){
  mode = m; photos = store[m] || [];
  ["Create","Combine","Edit"].forEach(t => $("t"+t).classList.toggle("on", m === t.toLowerCase()));
  $("photoBox").classList.toggle("hidden", m === "create");
  $("quickBox").classList.toggle("hidden", m !== "edit");
  $("origChip").classList.toggle("hidden", m !== "edit");
  if (m === "edit") pickAspect("orig"); else if (aspect === "orig") pickAspect("1:1");
  $("promptLabel").textContent = MODES[m].label;
  $("prompt").placeholder = MODES[m].ph;
  $("hint").textContent = MODES[m].hint;
  $("drop").textContent = m === "edit" ? "📁 Click or drag your photo here" : "📁 Click or drag photos here";
  $("file").multiple = m !== "edit";
  renderThumbs(); renderCredits();
}
$("tCreate").onclick = () => setMode("create");
$("tCombine").onclick = () => setMode("combine");
$("tEdit").onclick = () => setMode("edit");
$("quick").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  $("prompt").value = b.dataset.v; $("prompt").focus();
});

// --- chips ---
function chipGroup(id, cb){
  $(id).addEventListener("click", e => {
    const b = e.target.closest(".chip"); if(!b) return;
    [...$(id).children].forEach(c => c.classList.remove("on"));
    b.classList.add("on"); cb(b.dataset.v);
  });
}
chipGroup("styles", v => style = v);
chipGroup("aspects", v => aspect = v);

// --- photos: shrink to keep uploads small ---
function shrink(file){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 512, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      shrink.lastDims = { w: img.width, h: img.height };
      resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = reject; img.src = url;
  });
}
async function addFiles(files){
  for (const f of files) {
    if (!f.type.startsWith("image/")) continue;
    if (mode === "edit") {
      try { store.edit.splice(0, 1, await shrink(f)); editDims = shrink.lastDims; } catch {}
      break;
    }
    if (photos.length >= 4) continue;
    try { photos.push(await shrink(f)); } catch {}
  }
  renderThumbs();
}
function renderThumbs(){
  const t = $("thumbs"); t.innerHTML = "";
  photos.forEach((src, i) => {
    const d = document.createElement("div"); d.className = "thumb";
    d.innerHTML = `<img src="${src}"><button title="Remove">✕</button>`;
    d.querySelector("button").onclick = () => { photos.splice(i,1); renderThumbs(); };
    t.appendChild(d);
  });
  $("thumbs").classList.toggle("single", mode === "edit");
  $("photoLabel").textContent = mode === "edit" ? "Your photo" : `Your photos (${photos.length}/4)`;
}
$("drop").onclick = () => $("file").click();
$("file").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
["dragover","dragenter"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave","drop"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", e => addFiles(e.dataTransfer.files));
document.addEventListener("paste", e => {
  if (mode !== "combine") return;
  const files = [...(e.clipboardData?.files || [])]; if (files.length) addFiles(files);
});

// --- loading animation ---
const MSGS = ["Starting the machine","Warming up the gears","Mixing the pixels","Adding extra cool","Painting the light","Polishing every pixel","Almost there"];
let loadTimer = null;
function startLoading(){
  let i = 0, pct = 4;
  $("loadMsg").textContent = MSGS[0]; $("barFill").style.width = pct + "%";
  $("loading").classList.remove("hidden");
  loadTimer = setInterval(() => {
    i = Math.min(i + 1, MSGS.length - 1);
    $("loadMsg").textContent = MSGS[i];
    pct = Math.min(94, pct + (100 - pct) * 0.18);   // slows down near the end
    $("barFill").style.width = pct + "%";
  }, 1800);
}
function stopLoading(){ clearInterval(loadTimer); $("barFill").style.width = "100%"; $("loading").classList.add("hidden"); }

// Keep error messages short and readable.
function shortErr(m){
  m = String(m || "Something went wrong — try again.");
  if (/quota|RESOURCE_EXHAUSTED|billing/i.test(m)) return "That feature isn't available right now. No credits were used.";
  m = m.split("\n")[0];
  return m.length > 180 ? m.slice(0, 177) + "…" : m;
}

// Fetch a free-generator image in the browser, retrying if it's busy.
async function loadFree(url){
  for (let attempt = 0; attempt < 4; attempt++) {
    try {
      const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 60000);
      const r = await fetch(url, { signal: ctrl.signal }); clearTimeout(to);
      if (r.ok && (r.headers.get("content-type") || "").startsWith("image/")) {
        const blob = await r.blob();
        return await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
      }
    } catch {}
    $("loadMsg").textContent = "Machine is busy — retrying";
    await new Promise(r => setTimeout(r, 4000 + attempt * 3000));
  }
  throw new Error("busy");
}

// --- generate ---
function show(src){
  lastImage = src;
  $("empty").classList.add("hidden"); stopLoading();
  $("out").src = src; $("out").classList.remove("hidden"); $("actions").classList.remove("hidden");
}
async function generate(){
  $("err").textContent = "";
  let prompt = $("prompt").value.trim();
  const imgs = mode === "create" ? [] : photos;
  if (mode === "create" && !prompt) return $("err").textContent = "Type what you want to see first.";
  if (mode === "combine" && imgs.length === 0) return $("err").textContent = "Add at least one photo.";
  if (mode === "combine" && imgs.length === 1) return $("err").textContent = "Add at least 2 photos to combine — or use the ✏️ Edit photo tab for one photo.";
  if (mode === "edit" && imgs.length === 0) return $("err").textContent = "Upload a photo to edit first.";
  if (mode === "edit" && !prompt && !style) return $("err").textContent = "Type what should change, or tap a quick edit.";
  if (style) prompt = prompt ? `${prompt}, ${style}` : `in ${style}`;
  const cost = costNow();
  if (credits.left < cost) return $("err").textContent = "Out of credits for today — come back tomorrow for " + credits.max + " more!";

  $("go").disabled = true; $("go").dataset.busy = "1"; $("go").firstChild.textContent = "Generating… ";
  $("empty").classList.add("hidden"); $("out").classList.add("hidden");
  $("actions").classList.add("hidden"); startLoading();
  try {
    const r = await fetch("/api/generate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt, aspect, dims: aspect === "orig" ? editDims : undefined,
        images: imgs.map(d => ({ mimeType: d.slice(5, d.indexOf(";")), data: d.split(",")[1] }))
      })
    });
    const j = await r.json().catch(() => ({ error: "Server error — try again." }));
    if (!r.ok || !(j.image || j.url)) { applyServer(j); throw new Error(shortErr(j.error)); }
    let image = j.image;
    if (j.url) {
      // Create: load the picture straight from the free generator in this browser.
      $("loadMsg").textContent = "Painting the light";
      try { image = await loadFree(j.url); }
      catch (e) {
        const rf = await fetch("/api/generate", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ refund: j.ticket }) }).then(x => x.json()).catch(() => null);
        applyServer(rf);
        throw new Error("The picture machine is busy right now — wait a few seconds and try again. No credits were used.");
      }
    }
    setLocalUsed(localUsed() + cost);
    applyServer(j); renderCredits(true);
    show(image);
    const h = loadHist(); h.unshift(image); saveHist(h); renderHist();
  } catch (e) {
    stopLoading();
    if (lastImage) show(lastImage); else $("empty").classList.remove("hidden");
    $("err").textContent = shortErr(e.message);
  } finally {
    delete $("go").dataset.busy; $("go").firstChild.textContent = "Generate "; renderCredits();
  }
}
$("go").onclick = generate;
$("again").onclick = generate;
$("prompt").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) generate(); });
$("dl").onclick = () => { const a = document.createElement("a"); a.href = lastImage; a.download = "TheCPMachine.png"; a.click(); };
async function resultAsPhoto(){
  const blob = await (await fetch(lastImage)).blob();
  return shrink(new File([blob], "gen.png", { type: blob.type }));
}
$("editIt").onclick = async () => {
  if (!lastImage) return;
  store.edit.splice(0, 1, await resultAsPhoto()); editDims = shrink.lastDims;
  $("prompt").value = ""; setMode("edit");
  window.scrollTo({ top: 0, behavior: "smooth" });
};
$("useIt").onclick = async () => {
  if (!lastImage) return;
  setMode("combine");
  if (photos.length < 4) {
    const blob = await (await fetch(lastImage)).blob();
    photos.push(await shrink(new File([blob], "gen.png", { type: blob.type })));
    renderThumbs();
  }
};

renderHist();
</script>
</body>
</html>
